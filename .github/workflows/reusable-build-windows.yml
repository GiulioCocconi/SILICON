name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      build_type:
        required: false
        type: string
        default: "Release"
      checkout_ref:
        required: false
        type: string
      build_version:
        required: false
        type: string
      package_name:
        required: true
        type: string
      package_version:
        required: true
        type: string

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v3

      - name: Verify runner Ninja
        shell: powershell
        run: ninja --version

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/vcpkg_installed
            build/_deps
          key: windows-vcpkg-${{ hashFiles('**/vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          restore-keys: |
            windows-vcpkg-

      - name: Configure CMake
        shell: powershell
        env:
          CC: gcc
          CXX: g++
          BUILD_VERSION: ${{ inputs.build_version }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          $versionArgs = @()
          if ($env:BUILD_VERSION) {
            $versionArgs += "-DSILICON_VERSION=$env:BUILD_VERSION"
          }
          cmake -G Ninja "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE" -Bbuild @versionArgs

      - name: Build
        shell: powershell
        run: |
          # Replace this section if the project's real Windows build command changes.
          ninja -C build

      - name: Test
        shell: powershell
        run: ctest --test-dir build --output-on-failure

      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            build/vcpkg_installed
            build/_deps
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Package Windows artifact
        shell: powershell
        run: |
          ./ci/package_windows_artifact.ps1 `
            -PackageName "${{ inputs.package_name }}" `
            -PackageVersion "${{ inputs.package_version }}"

      - name: Upload packaged Windows artifact for handoff
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: out/*.zip
          retention-days: 1
