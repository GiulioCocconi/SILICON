name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      build_type:
        required: false
        type: string
        default: "Release"
      checkout_ref:
        required: false
        type: string
      build_version:
        required: false
        type: string
      cache_mode:
        description: vcpkg binary provider mode (PRs always read only)
        required: false
        type: string
        default: read
      package_name:
        required: true
        type: string
      package_version:
        required: true
        type: string

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v3

      - name: Verify runner Ninja
        shell: powershell
        run: ninja --version

      - name: Set up vcpkg binary cache
        id: vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          token: ${{ github.token }}
          cache-mode: ${{ inputs.cache_mode }}

      - name: Configure CMake
        shell: powershell
        env:
          CC: gcc
          CXX: g++
          BUILD_VERSION: ${{ inputs.build_version }}
          BUILD_TYPE: ${{ inputs.build_type }}
          VCPKG_SOURCE_DIR: ${{ steps.vcpkg.outputs.source-dir }}
        run: |
          $versionArgs = @()
          if ($env:BUILD_VERSION) {
            $versionArgs += "-DSILICON_VERSION=$env:BUILD_VERSION"
          }
          cmake -G Ninja "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE" -Bbuild "-DFETCHCONTENT_SOURCE_DIR_VCPKG=$env:VCPKG_SOURCE_DIR" @versionArgs

      - name: Build
        shell: powershell
        run: |
          # Replace this section if the project's real Windows build command changes.
          ninja -C build

      - name: Test
        shell: powershell
        run: ctest --test-dir build --output-on-failure

      - name: Package Windows artifact
        shell: powershell
        run: |
          ./ci/package_windows_artifact.ps1 `
            -PackageName "${{ inputs.package_name }}" `
            -PackageVersion "${{ inputs.package_version }}"

      - name: Upload packaged Windows artifact for handoff
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: out/*.zip
          retention-days: 1
