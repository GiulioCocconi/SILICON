name: Reusable Windows Build

on:
  workflow_call:
    inputs:
      publish:
        required: true
        type: boolean
      package_name:
        required: true
        type: string
      package_version:
        required: true
        type: string
      cloudsmith_owner:
        required: true
        type: string
      cloudsmith_repo:
        required: true
        type: string
      cloudsmith_oidc_namespace:
        required: true
        type: string
      cloudsmith_oidc_service_slug:
        required: true
        type: string

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup MinGW
        uses: egor-tensin/setup-mingw@v3

      - name: Install Ninja
        shell: powershell
        run: choco install ninja --no-progress -y

      - name: Restore vcpkg cache
        uses: actions/cache@v5
        with:
          path: |
            build/vcpkg_installed
            build/_deps
          key: windows-vcpkg-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            windows-vcpkg-

      - name: Configure CMake
        shell: powershell
        env:
          CC: gcc
          CXX: g++
        run: |
          # Replace this section if the project's real Windows configure step changes.
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -Bbuild

      - name: Build
        shell: powershell
        run: |
          # Replace this section if the project's real Windows build command changes.
          ninja -C build

      - name: Test
        shell: powershell
        run: ctest --test-dir build --output-on-failure

      - name: Package Windows artifact
        shell: powershell
        run: |
          ./ci/package_windows_artifact.ps1 `
            -PackageName "${{ inputs.package_name }}" `
            -PackageVersion "${{ inputs.package_version }}"

      - name: Upload packaged Windows artifact for handoff
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: out/*.zip
          retention-days: 1

  publish:
    if: inputs.publish
    name: Publish Windows to Cloudsmith
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download packaged Windows artifact
        uses: actions/download-artifact@v6
        with:
          name: windows-package
          path: out

      - name: Authenticate with Cloudsmith
        uses: cloudsmith-io/cloudsmith-cli-action@v2
        with:
          oidc-namespace: ${{ inputs.cloudsmith_oidc_namespace }}
          oidc-service-slug: ${{ inputs.cloudsmith_oidc_service_slug }}

      - name: Publish Windows raw package
        shell: bash
        run: |
          cloudsmith push raw \
            "${{ inputs.cloudsmith_owner }}/${{ inputs.cloudsmith_repo }}" \
            "out/${{ inputs.package_name }}-${{ inputs.package_version }}.zip" \
            --name "${{ inputs.package_name }}" \
            --version "${{ inputs.package_version }}"
