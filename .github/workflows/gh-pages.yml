name: Build and Deploy Silicon Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install doxygen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install webpage dependencies
        working-directory: webpage
        run: bun install

      - name: Build webpage
        working-directory: webpage
        env:
          VITE_CLOUDSMITH_OWNER: ${{ vars.CLOUDSMITH_OWNER }}
          VITE_CLOUDSMITH_RELEASE_REPO: ${{ vars.CLOUDSMITH_RELEASE_REPO }}
        run: bun run build:all

      - name: Prepare Pages site
        run: |
          mkdir -p dist/internaldocs
          cp -r docs/html/* dist/internaldocs
          cp -r webpage/dist/* dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
