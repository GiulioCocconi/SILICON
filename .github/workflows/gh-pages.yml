name: Website and documentation

on:
  push:
    branches: [main]
    paths:
      - "webpage/**"
      - "Doxyfile"
      - "README.md"
  workflow_dispatch:

jobs:
  detect:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip direct deployment when snapshot CI owns this commit
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ "${BEFORE}" =~ ^0+$ ]]; then
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if git diff --name-only "${BEFORE}" "${GITHUB_SHA}" |
            grep -Eq '(^ci/|^\.github/workflows/|^flake\.(nix|lock)$|^vcpkg\.json$|(^|/)CMakeLists\.txt$|\.(cpp|hpp|py|pmg|v|cmake)$)'; then
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
          else
            echo "docs_only=true" >> "${GITHUB_OUTPUT}"
          fi

  deploy:
    needs: detect
    if: always() && (github.event_name == 'workflow_dispatch' || needs.detect.outputs.docs_only == 'true')
    uses: ./.github/workflows/reusable-deploy-pages.yml
    with:
      checkout_ref: ${{ github.sha }}
    permissions:
      contents: read
      pages: write
      id-token: write
