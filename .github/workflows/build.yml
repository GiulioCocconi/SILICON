name: Snapshot Artifacts

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "**.cpp"
      - "**.hpp"
      - "**/CMakeLists.txt"
      - "**.cmake"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/**"
      - "ci/**"
      - "vcpkg.json"
  push:
    branches: [ "main" ]
    paths:
      - "**.cpp"
      - "**.hpp"
      - "**/CMakeLists.txt"
      - "**.cmake"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/**"
      - "ci/**"
      - "vcpkg.json"

concurrency:
  group: snapshot-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare snapshot metadata
    runs-on: ubuntu-latest
    outputs:
      build_type: ${{ steps.meta.outputs.build_type }}
      publish_wasm: ${{ steps.meta.outputs.publish_wasm }}
      publish_windows: ${{ steps.meta.outputs.publish_windows }}
      snapshot_version: ${{ steps.meta.outputs.snapshot_version }}
      wasm_package_name: ${{ steps.meta.outputs.wasm_package_name }}
      windows_package_name: ${{ steps.meta.outputs.windows_package_name }}
      cloudsmith_repo: ${{ steps.meta.outputs.cloudsmith_repo }}
    steps:
      - id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "build_type=Debug" >> "${GITHUB_OUTPUT}"
            echo "wasm_package_name=wasm-${{ github.event.pull_request.number }}" >> "${GITHUB_OUTPUT}"
            echo "windows_package_name=windows-${{ github.event.pull_request.number }}" >> "${GITHUB_OUTPUT}"
            echo "snapshot_version=${{ github.event.pull_request.head.sha }}" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith_repo=${{ vars.CLOUDSMITH_PR_REPO }}" >> "${GITHUB_OUTPUT}"

            if [[ "${{ github.event.pull_request.head.repo.fork }}" == "true" ]]; then
              echo "publish_wasm=false" >> "${GITHUB_OUTPUT}"
              echo "publish_windows=false" >> "${GITHUB_OUTPUT}"
            else
              echo "publish_wasm=true" >> "${GITHUB_OUTPUT}"
              echo "publish_windows=true" >> "${GITHUB_OUTPUT}"
            fi
          else
            short_sha="${GITHUB_SHA::7}"
            echo "build_type=Release" >> "${GITHUB_OUTPUT}"
            echo "wasm_package_name=silicon-unstable-wasm" >> "${GITHUB_OUTPUT}"
            echo "windows_package_name=silicon-unstable-windows" >> "${GITHUB_OUTPUT}"
            echo "snapshot_version=v${short_sha}-unstable" >> "${GITHUB_OUTPUT}"
            echo "cloudsmith_repo=${{ vars.CLOUDSMITH_RELEASE_REPO }}" >> "${GITHUB_OUTPUT}"
            echo "publish_wasm=true" >> "${GITHUB_OUTPUT}"
            echo "publish_windows=true" >> "${GITHUB_OUTPUT}"
          fi

  build-linux:
    name: Linux (Nix)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Build with Nix
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            nix build --print-build-logs
          else
            nix build --print-build-logs '.#release'
          fi

  wasm-snapshot:
    name: WASM snapshot
    needs: prepare
    uses: ./.github/workflows/reusable-build-wasm.yml
    with:
      build_type: ${{ needs.prepare.outputs.build_type }}
      publish: ${{ needs.prepare.outputs.publish_wasm == 'true' }}
      package_name: ${{ needs.prepare.outputs.wasm_package_name }}
      package_version: ${{ needs.prepare.outputs.snapshot_version }}
      cloudsmith_owner: ${{ vars.CLOUDSMITH_OWNER }}
      cloudsmith_repo: ${{ needs.prepare.outputs.cloudsmith_repo }}
      cloudsmith_oidc_namespace: ${{ vars.CLOUDSMITH_OIDC_NAMESPACE }}
      cloudsmith_oidc_service_slug: ${{ vars.CLOUDSMITH_OIDC_SERVICE_SLUG }}
    permissions:
      contents: read
      id-token: write

  windows-snapshot:
    name: Windows snapshot
    needs: prepare
    uses: ./.github/workflows/reusable-build-windows.yml
    with:
      build_type: ${{ needs.prepare.outputs.build_type }}
      publish: ${{ needs.prepare.outputs.publish_windows == 'true' }}
      package_name: ${{ needs.prepare.outputs.windows_package_name }}
      package_version: ${{ needs.prepare.outputs.snapshot_version }}
      cloudsmith_owner: ${{ vars.CLOUDSMITH_OWNER }}
      cloudsmith_repo: ${{ needs.prepare.outputs.cloudsmith_repo }}
      cloudsmith_oidc_namespace: ${{ vars.CLOUDSMITH_OIDC_NAMESPACE }}
      cloudsmith_oidc_service_slug: ${{ vars.CLOUDSMITH_OIDC_SERVICE_SLUG }}
    permissions:
      contents: read
      id-token: write
