name: Reusable WASM Build

on:
  workflow_call:
    inputs:
      build_type:
        required: false
        type: string
        default: "Release"
      checkout_ref:
        required: false
        type: string
      build_version:
        required: false
        type: string
      package_name:
        required: true
        type: string
      package_version:
        required: true
        type: string

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7

      - name: Install Qt for WASM
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.0"
          host: "all_os"
          target: "wasm"
          arch: "wasm_singlethread"

      - name: Install build dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y ninja-build autoconf autoconf-archive automake libtool jq zip

      - name: Prepare vcpkg manifest for WASM
        shell: bash
        run: bash ./ci/wasm_remove_deps.sh

      - name: Restore vcpkg cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            build/vcpkg_installed
            build/_deps
          key: wasm-vcpkg-${{ hashFiles('**/vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-ports/**') }}
          restore-keys: |
            wasm-vcpkg-

      - name: Configure CMake
        shell: bash
        env:
          BUILD_VERSION: ${{ inputs.build_version }}
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          version_args=()
          if [[ -n "${BUILD_VERSION}" ]]; then
            version_args+=("-DSILICON_VERSION=${BUILD_VERSION}")
          fi
          chmod +x ~/work/SILICON/Qt/6.11.0/wasm_singlethread/bin/qt-cmake
          ~/work/SILICON/Qt/6.11.0/wasm_singlethread/bin/qt-cmake -Bbuild -G Ninja "-DCMAKE_BUILD_TYPE=${BUILD_TYPE}" "${version_args[@]}"
          emcmake cmake -G Ninja "-DCMAKE_BUILD_TYPE=${BUILD_TYPE}" -Bbuild "${version_args[@]}"

      - name: Build
        shell: bash
        run: |
          # Replace this section if the project's real Qt for WASM build command changes.
          ninja -C build

      - name: Save vcpkg cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            build/vcpkg_installed
            build/_deps
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Package WASM artifact
        shell: bash
        run: |
          bash ./ci/package_wasm_artifact.sh \
            "${{ inputs.package_name }}" \
            "${{ inputs.package_version }}"

      - name: Upload packaged WASM artifact for handoff
        uses: actions/upload-artifact@v7
        with:
          name: wasm-package
          path: out/*.zip
          retention-days: 1
