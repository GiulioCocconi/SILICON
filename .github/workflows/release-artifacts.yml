name: Release Artifacts

on:
  release:
    types: [published]

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.validate.outputs.release_tag }}
      build_version: ${{ steps.validate.outputs.build_version }}
    steps:
      - id: validate
        shell: bash
        run: |
          tag="${{ github.event.release.tag_name }}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            echo "Accepted examples: v1.2.3, v1.2.3-rc.1, v1.2.3-beta.1" >&2
            exit 1
          fi

          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "build_version=${tag#v}" >> "${GITHUB_OUTPUT}"

  release-wasm:
    name: Release WASM artifact
    needs: validate-release
    uses: ./.github/workflows/reusable-build-wasm.yml
    with:
      cache_mode: readwrite
      checkout_ref: ${{ needs.validate-release.outputs.release_tag }}
      build_version: ${{ needs.validate-release.outputs.build_version }}
      build_type: "Release"
      package_name: silicon-release-wasm
      package_version: ${{ needs.validate-release.outputs.release_tag }}
    permissions:
      contents: read
      packages: write

  release-windows:
    name: Release Windows artifact
    needs: validate-release
    uses: ./.github/workflows/reusable-build-windows.yml
    with:
      cache_mode: readwrite
      checkout_ref: ${{ needs.validate-release.outputs.release_tag }}
      build_version: ${{ needs.validate-release.outputs.build_version }}
      build_type: "Release"
      package_name: silicon-release-windows
      package_version: ${{ needs.validate-release.outputs.release_tag }}
    permissions:
      contents: read
      packages: write

  publish:
    name: Publish legacy release packages
    needs: [validate-release, release-wasm, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate-release.outputs.release_tag }}
      - uses: nixbuild/nix-quick-install-action@v35
      - uses: actions/download-artifact@v8
        with:
          name: wasm-package
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: out
      - uses: cloudsmith-io/cloudsmith-cli-action@v3
        with:
          oidc-namespace: ${{ vars.CLOUDSMITH_OIDC_NAMESPACE }}
          oidc-service-slug: ${{ vars.CLOUDSMITH_OIDC_SERVICE_SLUG }}
      - name: Publish release ZIPs
        env:
          OWNER: ${{ vars.CLOUDSMITH_OWNER }}
          REPO: ${{ vars.CLOUDSMITH_RELEASE_REPO }}
          VERSION: ${{ needs.validate-release.outputs.release_tag }}
        run: |
          for platform in windows wasm; do
            name="silicon-release-${platform}"
            nix develop .#lightCI --command python ci/publish_packages.py cloudsmith "${OWNER}" "${REPO}" "${name}" "${VERSION}" "out/${name}-${VERSION}.zip"
          done
